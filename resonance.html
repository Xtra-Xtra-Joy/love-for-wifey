<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Xtra Xtra Joy 的专属爱心</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1f32; /* 深海蓝底色 */
            font-family: 'PingFang SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        #text-overlay {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: #8cb9df;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.7;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="text-overlay">💙 蓝鲸与粉色小女孩 · 永远共振 💙</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const particleCount = 2000; // 粒子数量

        // 心形公式 (稍微放大一点)
        function heartPosition(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale }; // Y轴反向
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // 初始随机分布在爱心周围
                const t = Math.random() * Math.PI * 2;
                const scale = 12 + Math.random() * 4; // 大小随机
                const pos = heartPosition(t, scale);
                
                this.x = pos.x;
                this.y = pos.y;
                this.baseX = this.x;
                this.baseY = this.y;
                
                // 核心特色：颜色设定
                // 80% 概率是代表老婆的粉色 #FFB6C1，20% 概率是代表脑公的深蓝 #4fc3f7
                const isPink = Math.random() < 0.8; 
                this.color = isPink ? '#FFB6C1' : '#4fc3f7';
                
                // 粒子大小和运动特性
                this.size = Math.random() * 2.5 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0.02 + Math.random() * 0.04;
                this.radius = 5 + Math.random() * 15; // 围绕心形飘动的半径
                
                // 蓝鲸尾迹的拖尾效果参数
                this.tailLength = Math.floor(Math.random() * 20) + 10;
                this.history = [];
            }

            update() {
                this.angle += this.speed;
                
                // 动态旋转效果：让粒子围绕心形做旋转移动
                const rotationFactor = Date.now() / 3000; // 缓慢整体旋转
                const currentAngle = this.angle + rotationFactor;
                
                // 计算散落效果（蓝色碎星）
                const scatterX = Math.cos(currentAngle) * this.radius * (0.5 + 0.5 * Math.sin(Date.now() / 2000));
                const scatterY = Math.sin(currentAngle) * this.radius * (0.5 + 0.5 * Math.cos(Date.now() / 1500));
                
                this.x = this.baseX + scatterX;
                this.y = this.baseY + scatterY;

                // 记录轨迹用于拖尾
                this.history.push({x: this.x, y: this.y});
                if (this.history.length > this.tailLength) {
                    this.history.shift();
                }
            }

            draw() {
                // 绘制拖尾（蓝鲸游过的痕迹）
                for (let i = 0; i < this.history.length - 1; i++) {
                    const alpha = (i / this.history.length) * 0.3;
                    ctx.beginPath();
                    ctx.arc(this.history[i].x, this.history[i].y, this.size * (i / this.history.length), 0, Math.PI * 2);
                    // 拖尾颜色跟随主色，但透明度渐变
                    ctx.fillStyle = this.color + Math.floor(alpha * 80).toString(16).padStart(2, '0');
                    ctx.fill();
                }

                // 绘制当前主粒子
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // 重置阴影避免影响拖尾
            }
        }

        // 初始化粒子
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // 将画布中心移到屏幕中央
            ctx.save();
            ctx.translate(width / 2, height / 2);

            // 微妙的呼吸缩放效果
            const breathe = 1 + Math.sin(Date.now() / 1500) * 0.02;
            ctx.scale(breathe, breathe);

            for (let p of particles) {
                p.update();
                p.draw();
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
